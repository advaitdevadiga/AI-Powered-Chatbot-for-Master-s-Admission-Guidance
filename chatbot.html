<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Career Guide</title>
  <link rel="stylesheet" href="css/chatbot.css" />
</head>
<body>
  <div class="chatbot-container">
    <div class="chatbot-box">
      <div class="chatbot-header">
        <span>💬 AI Career Guide</span>
        <a href="index.html" class="close-btn" title="Back to Home">✖</a>
      </div>

      <div id="chat-box">
        <div class="bot-msg">Hi! I'm your AI Guide. Ask me anything about MBA or MTech 😄</div>
      </div>

      <div class="input-section">
        <input type="text" id="user-input" placeholder="Ask your question..." />
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script src="js/chatbot.js"></script>
</body>
</html>
